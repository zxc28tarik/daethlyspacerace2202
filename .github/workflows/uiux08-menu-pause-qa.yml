name: UIUX08 approved menu and pause panels QA
on:
  push:
    branches: [codex/uiux-08-menu-pause-redesign]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu-pause-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Chromium WebGL dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: JS syntax and unique game interfaces
        run: |
          node --check tests/uiux08-menu-pause-redesign.cjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const chunks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(x=>x[1]).filter(Boolean);
          for(const chunk of chunks)new vm.Script(chunk);
          for(const id of ['ui-menu-rail','map-choice-1','map-choice-4','ui-settings-panel',
            'ui-pause-return','ui-pause-restart','resume-btn','start-btn']){
            if((html.match(new RegExp('id="'+id+'"','g'))||[]).length!==1)
              throw Error('Unique DOM id expected '+id);
          }
          console.log('PASS JS syntax and distinct interactive UI IDs');
          NODE
      - name: Four viewport real WebGL map cards and split pause
        run: node tests/uiux08-menu-pause-redesign.cjs
      - name: UIUX07 framing regression (adapted visible settings)
        run: node tests/uiux07-final-framing.cjs
      - name: UIUX06 result and six map regression
        run: node tests/uiux06-six-map-results.cjs
      - name: UIUX05 live settings regression (adapted visible settings)
        run: node tests/uiux05-live-settings.cjs
      - name: UIUX04 onboarding regression
        run: node tests/uiux04-briefing-first-flight.cjs
      - name: UIUX03 four stage HUD regression
        run: node tests/uiux03-map4-phase-hud.cjs
      - name: UIUX02 Map1 HUD regression
        run: node tests/uiux02-map1-race-hud.cjs
      - name: UIUX01 base UI regression
        run: node tests/uiux01-screen-regression.cjs
      - name: Original Map1 and Map4 gameplay smoke
        run: node tests/map4-browser-smoke.cjs
      - name: Upload genuine browser frames and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UIUX08-map-menu-pause-proof
          path: |
            tests/uiux08-evidence/*.png
            tests/uiux08-evidence/*.json
          if-no-files-found: warn
