name: MAP2-11 keep-it-low diagnostics
on:
  push:
    branches: [codex/map2-11-keep-it-low-visual-language]
    paths:
      - tools/map2-11-diagnose.py
      - .github/workflows/map2-11-diagnose.yml
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect keep-it-low hooks
        run: python tools/map2-11-diagnose.py
