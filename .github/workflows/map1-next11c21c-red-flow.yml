name: Map1 NEXT11C21C Racing Red Flow Real WebGL
on:
  push:
    branches: [codex/map1-sb07-zenit-red-flow-21c]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-flow-real-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and Three.js r128
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: Check C21C QA syntax
        run: node --check tests/map1-next11c21c-red-flow.cjs
      - name: Verify existing SB-07 geometry Map4 and original 1x AA
        run: node tests/map1-next11c20-sb07-zenit.cjs
      - name: Regression check native ceramic PBR and prior Balanced pigments
        run: |
          node tests/map1-next11c21a-native-pbr-finishes.cjs
          node tests/map1-next11c21b-balanced-colors.cjs
      - name: Validate real old versus new red on same GPU mesh
        run: node tests/map1-next11c21c-red-flow.cjs
      - name: Protect 304 corridor joins
        run: node tests/map1-next11c20r-rail-seams.cjs
      - name: Upload authentic 1x WebGL A/B and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-next11c21c-real-webgl-red-flow
          path: |
            tests/next11c21c-evidence/
            tests/next11c21b-evidence/
          if-no-files-found: warn
