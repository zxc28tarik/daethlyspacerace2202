name: Map1 NEXT11C21G5 Gentle Violet Inner Orbit
on:
  push:
    branches: [codex/map1-pickup-inner-orbit-angle-color-21g5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orbit-visual-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and offline bundle dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Node syntax test
        run: node --check tests/map1-next11c21g5-inner-orbit.cjs
      - name: Native WebGL blue upright vs violet angled comparison
        run: node tests/map1-next11c21g5-inner-orbit.cjs
      - name: Previous triple-ring and no-metal WebGL regressions
        run: |
          node tests/map1-next11c21g4-triple-orbit.cjs
          node tests/map1-next11c21g3-no-metal.cjs
      - name: Preserve original random prize HYPER behavior
        run: node tests/map1-next11c21g-reward-hyper.cjs
      - name: Protect the approved ship and corridor geometry
        run: |
          node tests/map1-next11c20-sb07-zenit.cjs
          node tests/map1-next11c20r-rail-seams.cjs
      - name: Build entire OFFLINE single-file playable HTML
        run: node tools/build-gfx01-bundle.cjs
      - name: Publish updated playable game and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-c21g5-violet-inner-orbit-playable
          path: |
            tests/next11c21g5-evidence/
            dist/Uzay_Yarisi_Guncel_Oynanabilir.html
            dist/gfx01-build-manifest.json
          if-no-files-found: warn
