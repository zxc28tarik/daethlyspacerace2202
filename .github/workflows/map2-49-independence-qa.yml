name: MAP2-49 independent buildings regression and performance
on:
  push:
    branches: [feature/map2-48-independent-buildings]
    paths:
      - tests/map2-48-detached-runtime.cjs
      - tests/map2-48-visual-fingerprint.js
      - tests/map2-50-baseline-parity.cjs
      - tests/map2-50-no-world-fallback.cjs
      - tests/map2-44-physical-consistency.cjs
      - tests/map2-04-low-flight-patrol.cjs
      - tests/map2-46-route-hud-clarity.cjs
      - tests/map2-49-rehydrate-library.cjs
      - tests/map2-49-performance-parity.cjs
      - .github/workflows/map2-49-independence-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map2-49-independent-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  map2-independent-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser QA dependencies
        run: npm install --no-save playwright@1.56.1 three@0.128.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify source archive rehydration without Map4
        run: node tests/map2-49-rehydrate-library.cjs
      # Historical MAP2-13/42/05 assumptions are superseded, not silently
      # passed: those tests use unbatched object identity, obsolete camera
      # sampling, and a fixed gantry altitude blocked in the approved baseline.
      # Preserve the actual current geometry, collisions and bot behavior.
      - name: Prepare pinned approved pre-independence baseline
        if: ${{ !cancelled() }}
        run: |
          git show b8c120001d6dc011cac3f18585ea53cf3b342ce5:index.html > tests/map2-49-baseline.html
          test -s tests/map2-49-baseline.html
      - name: MAP2-13 successor - exact station source geometry and architecture
        if: ${{ !cancelled() }}
        run: node tests/map2-48-detached-runtime.cjs
      - name: MAP2-42 and MAP2-05 successor - all facade data, gates, collision and matched views
        if: ${{ !cancelled() }}
        run: node tests/map2-50-baseline-parity.cjs
      - name: Actual independent-only runtime and failure behavior
        if: ${{ !cancelled() }}
        run: node tests/map2-50-no-world-fallback.cjs
      - name: MAP2-42 successor - physical frontage and every alternate route
        if: ${{ !cancelled() }}
        run: node tests/map2-44-physical-consistency.cjs
      - name: MAP2-05 successor - Map1 round trip, course, route decisions and full fleet
        if: ${{ !cancelled() }}
        run: node tests/map2-04-low-flight-patrol.cjs
      - name: Current alternative route HUD
        if: ${{ !cancelled() }}
        run: node tests/map2-46-route-hud-clarity.cjs
      - name: Compare cold load, heap and playable FPS in same browser
        if: ${{ !cancelled() }}
        run: node tests/map2-49-performance-parity.cjs
      - name: Save MAP2-49 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map2-49-independent-parity-results
          path: |
            tests/map2-48-evidence/
            tests/map2-49-evidence/
            tests/map2-50-evidence/
            tests/map2-44-evidence/
            tests/map2-04-evidence/
          if-no-files-found: warn
