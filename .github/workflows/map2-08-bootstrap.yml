name: MAP2-08 bootstrap industrial stage rebuild
on:
  push:
    branches: [codex/map2-08-visual-stage-rebuild]
    paths:
      - tools/map2-08-patch.py
      - .github/workflows/map2-08-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-08-visual-stage-rebuild
          fetch-depth: 0
      - name: Apply MAP2-08 patch
        run: python tools/map2-08-patch.py
      - name: Validate patched source markers
        run: |
          grep -q "MAP2_VISUAL_FACTORY_" index.html
          grep -q "const depth=\[620,460,700,520\]" index.html
          grep -q "visualStage:{...map2VisualStageStats}" index.html
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-08 rebuild industrial visual stage"
          git push origin HEAD:codex/map2-08-visual-stage-rebuild
