name: Map1 NEXT11C20O Merged Guide Rings and Real WebGL QA
on:
  push:
    branches: [codex/map1-sb07-zenit-corridor-clarity-o]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map1-corridor-clutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser without Ubuntu APT mirror dependency
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: Assert 192 actual rings merged to 10 drawables and keep Map4 untouched
        run: node tests/map1-next11c20o-corridor-clarity.cjs
      - name: Upload actual Map1 Map4 720p WebGL and guide geometry proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map1-next11c20o-real-corridor-evidence
          path: tests/next11c20o-evidence/
          if-no-files-found: warn
