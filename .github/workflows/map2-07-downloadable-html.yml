name: MAP2-07 downloadable offline HTML
on:
  push:
    branches: [codex/map2-07-patrol-approach]
    paths:
      - .github/workflows/map2-07-downloadable-html.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-07-patrol-approach
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install offline build dependencies
        run: npm install --no-save three@0.128.0 tailwindcss@3.4.17
      - name: Build single-file offline HTML
        run: |
          node tools/build-gfx01-bundle.cjs
          test -s dist/Uzay_Yarisi_Guncel_Oynanabilir.html
          cp dist/Uzay_Yarisi_Guncel_Oynanabilir.html DEATHLY_SPACE_RACE_MAP2_07_OYNANABILIR.html
      - name: Publish direct-download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="playable-html-map2-07"
          FILE="DEATHLY_SPACE_RACE_MAP2_07_OYNANABILIR.html"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Deathly Space Race MAP2-07 Oynanabilir HTML" --notes "MAP2-07 tek dosyalık çevrimdışı oynanabilir HTML." --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload "$TAG" "$FILE" --clobber
          gh release edit "$TAG" --target "$GITHUB_SHA" --notes "MAP2-07 tek dosyalık çevrimdışı oynanabilir HTML. Kaynak commit: $GITHUB_SHA" --latest=false
