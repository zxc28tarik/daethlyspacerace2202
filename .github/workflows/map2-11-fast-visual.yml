name: MAP2-11 fast visual QA
on:
  push:
    branches: [codex/map2-11-keep-it-low-visual-language]
    paths:
      - tests/map2-11-keep-it-low-visual.cjs
      - .github/workflows/map2-11-fast-visual.yml
      - index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify patrol source markers
        run: |
          grep -n "const ahead=" index.html | tail -5
          grep -n "const target=" index.html | tail -5
          grep -q "const target=state.pos.clone()" index.html
          grep -q "const ahead=62-v.approach\*18+strike\*42" index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: MAP2-11 visual only
        run: node tests/map2-11-keep-it-low-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-11-fast-evidence
          path: tests/map2-11-evidence/
          if-no-files-found: warn
