name: Map1 NEXT11C20U Integrated Engine Fairing Visual QA
on:
  push:
    branches: [codex/map1-sb07-zenit-fairing-contour-u]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joined-engine-fairing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install real Chromium and Three.js r128
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: Check source syntax
        run: node --check tests/map1-next11c20u-contoured-spines.cjs
      - name: Verify SB-07 source art, actual flying and protected B-04
        run: node tests/map1-next11c20-sb07-zenit.cjs
      - name: Probe actual engine surface and capture four WebGL studio viewpoints
        run: node tests/map1-next11c20u-contoured-spines.cjs
      - name: Confirm 304 original corridor rail joins intact
        run: node tests/map1-next11c20r-rail-seams.cjs
      - name: Upload real rendered SB-07 geometry and Map4 check proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-next11c20u-sculpted-spines-real-webgl
          path: |
            tests/next11c20u-evidence/
            tests/map1-next11c20-zenit-studio*.png
            tests/map1-next11c20-zenit-studio-drive-diagnostics.json
            tests/next11c20r-evidence/
          if-no-files-found: warn
