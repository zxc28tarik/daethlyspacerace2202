name: MAP2-12 apply visible Map4 buildings
on:
  push:
    branches: [codex/map2-12-map4-building-reuse]
    paths:
      - tools/map2-12-fix-visible-buildings.py
      - .github/workflows/map2-12-visible-buildings-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-12-map4-building-reuse
          fetch-depth: 0
      - name: Apply visible Map4 buildings patch
        run: python tools/map2-12-fix-visible-buildings.py
      - name: Validate active Map4 visuals are wired
        run: |
          grep -q "map4Source='h4Vis02Kits" index.html
          grep -q "MAP2_MAP4_VIS02_" index.html
          ! grep -q "const core=new THREE.Mesh(H4_MESHES.structure,mesh.material)" index.html
      - name: Commit game patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-12 show active Map4 buildings instead of black cores"
          git push origin HEAD:codex/map2-12-map4-building-reuse
