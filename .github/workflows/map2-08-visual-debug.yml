name: MAP2-08 real camera visual debug
on:
  push:
    branches: [codex/map2-08-visual-stage-rebuild]
    paths:
      - tests/map2-08-visual-debug.cjs
      - .github/workflows/map2-08-visual-debug.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: Capture Map 2 real-camera approach views
        run: node tests/map2-08-visual-debug.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-08-visual-debug
          path: tests/map2-08-debug-evidence/
          if-no-files-found: warn
