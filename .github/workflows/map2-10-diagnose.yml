name: MAP2-10 composition diagnostics
on:
  push:
    branches: [codex/map2-10-composition-chokepoints]
    paths:
      - tools/map2-10-diagnose.py
      - .github/workflows/map2-10-diagnose.yml
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Map 2 composition hooks
        run: python tools/map2-10-diagnose.py
