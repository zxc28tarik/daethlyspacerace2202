name: MAP2-18 real building chokepoints
on:
  push:
    branches: [codex/map2-18-building-obstacle-chokepoints]
    paths:
      - tools/map2-18-building-obstacles.py
      - tests/map2-18-building-obstacles.cjs
      - .github/workflows/map2-18-building-chokepoints.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-18-building-obstacle-chokepoints
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Locate Map2 build ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for key in ["map2BuildCourse","map2Gates.push","map2Obstacles.push","starbladeMap2Layout","map2CloneExactMap4IndustrialVisualParts"]:
              print("\n=== "+key+" ===")
              start=0
              found=0
              while True:
                  i=s.find(key,start)
                  if i<0: break
                  line=s.count("\n",0,i)+1
                  print("line",line)
                  print(s[max(0,i-500):i+900])
                  start=i+1
                  found+=1
                  if found>=6: break
          PY
      - name: Apply real-building obstacle layout
        run: python tools/map2-18-building-obstacles.py
      - name: Validate MAP2-18 markers
        run: |
          grep -q "map2BuildPhysicalMap4BuildingObstacles" index.html
          grep -q "map2PhysicalBuilding" index.html
          grep -q "map4BuildingColliders" index.html
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: MAP2-18 building collision/chokepoint QA
        run: node tests/map2-18-building-obstacles.cjs
      - name: MAP2-05 route reachability and fleet regression
        run: node tests/map2-05-course-flow.cjs
      - name: MAP2-17 exact 985-mesh / coverage regression
        run: node tests/map2-17-full-industrial-coverage.cjs
      - name: MAP2-16 remaining buildings regression
        run: node tests/map2-16-remaining-map4-buildings.cjs
      - name: MAP2-14 W05 density regression
        run: node tests/map2-14-dense-map4-road-buildings.cjs
      - name: MAP2-11 KEEP IT LOW regression
        run: node tests/map2-11-keep-it-low-visual.cjs
      - name: Commit building obstacle layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-18 make real Map4 buildings physical route chokepoints"
          git push origin HEAD:codex/map2-18-building-obstacle-chokepoints
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-18-building-chokepoint-evidence
          path: tests/map2-18-evidence/
          if-no-files-found: warn
