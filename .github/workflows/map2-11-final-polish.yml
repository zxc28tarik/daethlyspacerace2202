name: MAP2-11 apply final visual polish
on:
  push:
    branches: [codex/map2-11-keep-it-low-visual-language]
    paths:
      - tools/map2-11-final-polish.py
      - .github/workflows/map2-11-final-polish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-11-keep-it-low-visual-language
          fetch-depth: 0
      - name: Apply MAP2-11 final polish
        run: python tools/map2-11-final-polish.py
      - name: Validate polish
        run: |
          grep -q "const ahead=155-v.approach\*35+strike\*55" index.html
          grep -q "seg==='TECH'?0:seg==='FAST'?2:1" index.html
      - name: Commit game polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-11 polish patrol framing and contextual guidance"
          git push origin HEAD:codex/map2-11-keep-it-low-visual-language
