name: MAP4 CITY01 Downloadable Playable HTML
on:
  push:
    branches: [codex/map4-city-sphere-fighter-scale-lock]
    paths:
      - .github/workflows/map4-city01-download.yml
      - index.html
      - assets/**
      - tools/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install offline bundle toolchain
        run: npm install --no-save three@0.128.0 tailwindcss@3.4.17
      - name: Produce verified self-contained playable HTML
        run: |
          node tools/build-gfx01-bundle.cjs
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('dist/Uzay_Yarisi_Guncel_Oynanabilir.html','utf8');
          const m=JSON.parse(fs.readFileSync('dist/gfx01-build-manifest.json','utf8'));
          for(const x of ['MAP4_CITY_ARENA','MAP4_HUNTER_TARGETING','ui-menu-rail',
            'h4CityArenaColliders']){
            if(!s.includes(x))throw Error('missing in offline HTML '+x);
          }
          if(!m.offline.embeddedThree||!m.offline.embeddedGLTFLoader||
            !m.offline.embeddedAssets||!m.offline.embeddedTailwind)
            throw Error('Offline bundle missing dependencies');
          console.log('PASS MAP4 CITY01 offline '+m.bundleBytes);
          NODE
          cp dist/Uzay_Yarisi_Guncel_Oynanabilir.html dist/DEATHLY_SPACE_RACE_MAP4_CITY01.html
      - uses: actions/upload-artifact@v4
        with:
          name: Deathly-Space-Race-Map4-City01-Oynanabilir
          path: dist/DEATHLY_SPACE_RACE_MAP4_CITY01.html
          if-no-files-found: error
          retention-days: 30
