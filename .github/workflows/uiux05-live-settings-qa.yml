name: UIUX05 live settings and persistent options acceptance
on:
  push:
    branches: [codex/uiux-05-live-settings-panel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uiux05-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Parse HTML scripts
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if(!scripts.length)throw Error('Missing embedded JS');
          scripts.forEach(src=>new vm.Script(src));
          console.log('PASS: embedded JS parse');
          NODE
      - name: Four-view Chromium WebGL real audio and settings acceptance
        run: node tests/uiux05-live-settings.cjs
      - name: UIUX04 preflight and onboarding regression
        run: node tests/uiux04-briefing-first-flight.cjs
      - name: UIUX03 four-stage mission HUD regression
        run: node tests/uiux03-map4-phase-hud.cjs
      - name: UIUX02 focused race HUD regression
        run: node tests/uiux02-map1-race-hud.cjs
      - name: UIUX01 menu pause results regression
        run: node tests/uiux01-screen-regression.cjs
      - name: Original Map1 and Map4 gameplay regression
        run: node tests/map4-browser-smoke.cjs
      - name: Save Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux05-live-settings-screenshots
          path: |
            tests/uiux05-evidence/*.png
            tests/uiux04-evidence/*.png
          if-no-files-found: warn
