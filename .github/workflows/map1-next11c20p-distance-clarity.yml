name: Map1 NEXT11C20P Distance-Aware Line Clarity WebGL QA
on:
  push:
    branches: [codex/map1-sb07-zenit-distance-clarity-p]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map1-distance-clarity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium WebGL smoke dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: C20O original ring coordinates, 39/153 rings and Map4
        run: node tests/map1-next11c20o-corridor-clarity.cjs
      - name: C20P rail geometry, GPU distance fade and Map4 no-regression
        run: node tests/map1-next11c20p-distance-clarity.cjs
      - name: Upload real Chromium WebGL 720p and exact geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-next11c20p-real-webgl-clarity
          path: |
            tests/next11c20o-evidence/
            tests/next11c20p-evidence/
          if-no-files-found: warn
