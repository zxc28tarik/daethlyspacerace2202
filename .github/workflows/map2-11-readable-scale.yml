name: MAP2-11 apply readable patrol scale
on:
  push:
    branches: [codex/map2-11-keep-it-low-visual-language]
    paths:
      - tools/map2-11-readable-scale.py
      - .github/workflows/map2-11-readable-scale.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-11-keep-it-low-visual-language
          fetch-depth: 0
      - run: python tools/map2-11-readable-scale.py
      - name: Validate scale
        run: grep -q "setScalar(3.7)" index.html
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-11 enlarge patrol visual for readability"
          git push origin HEAD:codex/map2-11-keep-it-low-visual-language
