name: Map1 Map4 NEXT11C20N 720p 1080p WebGL Render Budget
on:
  push:
    branches: [codex/map1-sb07-zenit-native-budget-evidence-n]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install exact test browser and Three.js
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Test original Map1 and Map4 in actual WebGL 720p and 1080p
        run: node tests/map1-next11c20n-gpu-budget.cjs
      - name: Upload 720p actual rendered frames and transparent performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sb07-next11c20n-native-budget-artifacts
          path: tests/next11c20n-perf/
          if-no-files-found: warn
