name: MAP2-10 chokepoint composition browser QA
on:
  push:
    branches: [codex/map2-10-composition-chokepoints]
    paths:
      - index.html
      - tests/map2-10-composition.cjs
      - .github/workflows/map2-10-composition.yml
  pull_request:
    branches: [codex/map2-09-industrial-detail-pass]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: MAP2-05 course regression
        run: node tests/map2-05-course-flow.cjs
      - name: MAP2-06 aperture regression
        run: node tests/map2-06-aperture-cues.cjs
      - name: MAP2-07 patrol regression
        run: node tests/map2-07-patrol-approach.cjs
      - name: MAP2-08 industrial stage regression
        run: node tests/map2-08-industrial-stage.cjs
      - name: MAP2-09 industrial detail regression
        run: node tests/map2-09-industrial-details.cjs
      - name: MAP2-10 chokepoint composition QA
        run: node tests/map2-10-composition.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-10-browser-evidence
          path: |
            tests/map2-09-evidence/
            tests/map2-10-evidence/
          if-no-files-found: warn
