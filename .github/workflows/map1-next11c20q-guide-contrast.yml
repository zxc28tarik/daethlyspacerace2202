name: Map1 NEXT11C20Q Guide Contrast Real WebGL A-B QA
on:
  push:
    branches: [codex/map1-sb07-zenit-guide-contrast-q]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map1-fixed-camera-contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install original Three and Chromium (no Ubuntu apt mirror)
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: Original 192 ring geometry and preserved Map4 physics
        run: node tests/map1-next11c20o-corridor-clarity.cjs
      - name: C20P longitudinal rail batching and progress fade
        run: node tests/map1-next11c20p-distance-clarity.cjs
      - name: C20Q identical-camera WebGL A-B, new warning fade and protected gameplay
        run: node tests/map1-next11c20q-guide-contrast.cjs
      - name: Upload real unfaded-versus-clean screenshots, JSON and Map4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-next11c20q-controlled-webgl-ab
          path: |
            tests/next11c20o-evidence/
            tests/next11c20p-evidence/
            tests/next11c20q-evidence/
          if-no-files-found: warn
