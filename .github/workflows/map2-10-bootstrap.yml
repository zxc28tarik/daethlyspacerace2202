name: MAP2-10 bootstrap chokepoint composition
on:
  push:
    branches: [codex/map2-10-composition-chokepoints]
    paths:
      - tools/map2-10-patch.py
      - .github/workflows/map2-10-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-10-composition-chokepoints
          fetch-depth: 0
      - name: Apply MAP2-10 composition patch
        run: python tools/map2-10-patch.py
      - name: Validate composition markers
        run: |
          grep -q "MAP2_CHOKE_WALL_" index.html
          grep -q "MAP2_TURN_FRAME_" index.html
          grep -q "MAP2_HANGAR_TOWER_" index.html
          grep -q "MAP2_SLOT_MACHINE_" index.html
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-10 strengthen industrial chokepoint composition"
          git push origin HEAD:codex/map2-10-composition-chokepoints
