name: MAP2-11 bootstrap keep-it-low visual language
on:
  push:
    branches: [codex/map2-11-keep-it-low-visual-language]
    paths:
      - tools/map2-11-patch.py
      - .github/workflows/map2-11-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-11-keep-it-low-visual-language
          fetch-depth: 0
      - name: Apply MAP2-11 patch
        run: python tools/map2-11-patch.py
      - name: Validate markers
        run: |
          grep -q "MAP2_ROOFLINE_RAIL_" index.html
          grep -q "MAP2_SAFE_APERTURE_" index.html
          grep -q "MAP2_PATROL_SEARCHLIGHT" index.html
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-11 integrate keep-it-low visual language"
          git push origin HEAD:codex/map2-11-keep-it-low-visual-language
