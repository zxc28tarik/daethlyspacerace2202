name: MAP2-12 final downloadable HTML
on:
  push:
    branches: [codex/map2-12-map4-building-reuse]
    paths:
      - .github/workflows/map2-12-final-download.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-12-map4-building-reuse
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install offline build dependencies
        run: npm install --no-save three@0.128.0 tailwindcss@3.4.17
      - name: Build corrected one-file HTML
        run: |
          node tools/build-gfx01-bundle.cjs
          test -s dist/Uzay_Yarisi_Guncel_Oynanabilir.html
          cp dist/Uzay_Yarisi_Guncel_Oynanabilir.html DEATHLY_SPACE_RACE_MAP2_12_MAP4_BINALAR_DUZELTILDI.html
          sha256sum DEATHLY_SPACE_RACE_MAP2_12_MAP4_BINALAR_DUZELTILDI.html
      - uses: actions/upload-artifact@v4
        with:
          name: deathly-space-race-map2-12-corrected-html
          path: DEATHLY_SPACE_RACE_MAP2_12_MAP4_BINALAR_DUZELTILDI.html
          if-no-files-found: error
