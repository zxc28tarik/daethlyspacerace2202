name: MAP2-07 patrol approach browser QA
on:
  push:
    branches: [codex/map2-07-patrol-approach]
  pull_request:
    branches: [codex/map2-06-aperture-cues]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: MAP2-05 full-course regression
        run: node tests/map2-05-course-flow.cjs
      - name: MAP2-06 aperture cue regression
        run: node tests/map2-06-aperture-cues.cjs
      - name: MAP2-07 patrol approach, lock and breakaway
        run: node tests/map2-07-patrol-approach.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-07-browser-evidence
          path: |
            tests/map2-05-evidence/
            tests/map2-06-evidence/
            tests/map2-07-evidence/
          if-no-files-found: warn
