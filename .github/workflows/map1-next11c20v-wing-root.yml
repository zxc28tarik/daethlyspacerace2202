name: Map1 NEXT11C20V Sculpted Wing Root Real WebGL
on:
  push:
    branches: [codex/map1-sb07-zenit-wing-root-v]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map1-wing-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install genuine Chromium and Three.js r128
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: Check new JS test syntax
        run: node --check tests/map1-next11c20v-wing-root-fillet.cjs
      - name: Approved SB-07 flying silhouette / Map4 protection
        run: node tests/map1-next11c20-sb07-zenit.cjs
      - name: NEXT11C20U preserve integrated engine spines and 30 clearances
        run: node tests/map1-next11c20u-contoured-spines.cjs
      - name: NEXT11C20V verify 60 real 3D wing-root vertices and four views
        run: node tests/map1-next11c20v-wing-root-fillet.cjs
      - name: Preserve 304 rail group seams and Map4 physics
        run: node tests/map1-next11c20r-rail-seams.cjs
      - name: Upload four-angle real WebGL results and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-next11c20v-sculpted-wing-root-real-webgl
          path: |
            tests/next11c20v-evidence/
            tests/next11c20u-evidence/
            tests/map1-next11c20-zenit-studio*.png
            tests/next11c20r-evidence/
          if-no-files-found: warn
