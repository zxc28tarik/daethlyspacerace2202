name: Map1 NEXT11C21U Quick WebGL Visual Proof
on:
  push:
    branches: [codex/map1-sb07-hull-contour-light-21u]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c21u-in-game-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install native Chromium and WebGL regression dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Native 1600x900 original SB07 hull before-after game camera
        run: node tests/map1-next11c21u-hull-contour.cjs
      - name: Upload genuine before-after screenshots and exact numeric delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-c21u-sb07-hull-camera-before-after
          path: tests/next11c21u-evidence/
          if-no-files-found: warn
