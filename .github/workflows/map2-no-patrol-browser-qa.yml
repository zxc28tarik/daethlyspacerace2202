name: MAP2 overhead patrol retirement — browser regression
on:
  push:
    branches: [feature/map2-remove-overhead-patrol-2026-11-27]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: MAP2-07 no overhead patrol and no air warning
        run: node tests/map2-07-patrol-approach.cjs
      - name: MAP2-11 map architecture visual and no overhead enemy
        run: node tests/map2-11-keep-it-low-visual.cjs
      - name: MAP2-04 full-course rival behavior and no patrol damage
        run: node tests/map2-04-low-flight-patrol.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-no-patrol-browser-evidence
          path: |
            tests/map2-04-evidence/
            tests/map2-11-evidence/
          if-no-files-found: warn
