name: MAP2-47 independent City02 prefabs
on:
  push:
    branches:
      - feature/map2-47-independent-city-prefabs
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate independent Map2 city prefab data in both builds
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: python3 tools/map2-47-own-city-prefabs.py
      - name: Verify independent city spec
        run: node tests/map2-47-own-city-prefabs.cjs
      - name: Commit updated playable HTML builds to feature branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/Uzay_Yarisi_Guncel_Oynanabilir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "MAP2-47: own City02 architecture in both playable builds"
          git push
