name: UIUX06 six map picker and result hierarchy acceptance
on:
  push:
    branches: [codex/uiux-06-six-map-results]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uiux06-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Check HTML JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const chunks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          if(!chunks.length)throw Error('No embedded scripts');
          chunks.forEach(src=>new vm.Script(src));
          console.log('PASS embedded JS');
          NODE
      - name: Six map picker and Map1 Map4 DNF finish win results in four WebGL viewports
        run: node tests/uiux06-six-map-results.cjs
      - name: UIUX05 audio graphics accessibility regression
        run: node tests/uiux05-live-settings.cjs
      - name: UIUX04 briefing first-flight regression
        run: node tests/uiux04-briefing-first-flight.cjs
      - name: UIUX03 Map4 four-phase HUD regression
        run: node tests/uiux03-map4-phase-hud.cjs
      - name: UIUX02 Map1 race HUD regression
        run: node tests/uiux02-map1-race-hud.cjs
      - name: UIUX01 menu pause results regression
        run: node tests/uiux01-screen-regression.cjs
      - name: Original Map1 and Map4 gameplay regression
        run: node tests/map4-browser-smoke.cjs
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux06-six-map-results-webgl
          path: |
            tests/uiux06-evidence/*.png
            tests/uiux05-evidence/*.png
          if-no-files-found: warn
