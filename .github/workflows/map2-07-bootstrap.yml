name: MAP2-07 bootstrap patrol approach
on:
  push:
    branches: [codex/map2-07-patrol-approach]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-07-patrol-approach
      - name: Apply MAP2-07 patch
        run: python tools/map2-07-patch.py
      - name: Validate inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
            if(m[1].trim())new vm.Script(m[1]);
          }
          console.log('inline scripts parse');
          NODE
      - name: Commit MAP2-07 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/map2-07-patrol-approach.cjs
          git commit -m "MAP2-07 patrol approach and threat readability"
          git push origin HEAD:codex/map2-07-patrol-approach
