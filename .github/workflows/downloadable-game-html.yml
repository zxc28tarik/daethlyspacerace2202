name: Downloadable Game HTML
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/gfx01/**
      - tools/build-gfx01-bundle.cjs
      - tools/gfx01-assets.cjs
      - tools/gfx01b-sculpt-kit.cjs
      - tools/gfx01b-surface-atlas.cjs
      - tools/gfx01-tailwind.css
      - .github/workflows/downloadable-game-html.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: downloadable-game-html
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned offline build dependencies
        run: npm install --no-save three@0.128.0 tailwindcss@3.4.17
      - name: Bundle and check the offline single HTML
        run: |
          node tools/build-gfx01-bundle.cjs
          test -s dist/Uzay_Yarisi_Guncel_Oynanabilir.html
      - name: Publish a browser-downloadable HTML asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          cp dist/Uzay_Yarisi_Guncel_Oynanabilir.html release/Uzay_Yarisi_Guncel_Oynanabilir.html
          if ! gh release view playable-html-current >/dev/null 2>&1; then
            gh release create playable-html-current --title "Güncel Oynanabilir HTML" --notes "Bu sürüm doğrudan indirilebilir bir HTML oyun dosyası içerir." --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload playable-html-current release/Uzay_Yarisi_Guncel_Oynanabilir.html --clobber
          gh release edit playable-html-current --notes "Güncel HTML oyun dosyası. Kaynak commit: $GITHUB_SHA" --latest=false
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/playable-html-current/Uzay_Yarisi_Guncel_Oynanabilir.html"
