name: Downloadable Game HTML
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/downloadable-game-html.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: downloadable-game-html
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish a browser-downloadable HTML asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          cp index.html release/Uzay_Yarisi_Guncel_Oynanabilir.html
          if ! gh release view playable-html-current >/dev/null 2>&1; then
            gh release create playable-html-current --title "Güncel Oynanabilir HTML" --notes "Bu sürüm doğrudan indirilebilir bir HTML oyun dosyası içerir." --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload playable-html-current release/Uzay_Yarisi_Guncel_Oynanabilir.html --clobber
          gh release edit playable-html-current --notes "Güncel HTML oyun dosyası. Kaynak commit: $GITHUB_SHA" --latest=false
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/playable-html-current/Uzay_Yarisi_Guncel_Oynanabilir.html"
