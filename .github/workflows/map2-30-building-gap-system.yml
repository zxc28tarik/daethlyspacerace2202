# MAP2-30/31 golden-sector QA
name: MAP2-30 building gap system
on:
  push:
    branches: [codex/map2-30-building-gap-system]
    paths:
      - index.html
      - tools/map2-30-building-gap-system.py
      - tools/map2-32-33-building-roles-playable-passages.py
      - tools/map2-34-controlled-chaos.py
      - tools/map2-35-decision-sightlines.py
      - tools/map2-36-37-ground-route-costs.py
      - tests/map2-30-building-gap-system.cjs
      - tests/map2-32-33-building-roles-playable-passages.cjs
      - tests/map2-34-controlled-chaos.cjs
      - tests/map2-35-decision-sightlines.cjs
      - tests/map2-36-37-ground-route-costs.cjs
      - docs/MAP2_BUILDING_GAP_CHAOS_MASTER_PLAN_TR.md
      - .github/workflows/map2-30-building-gap-system.yml
  workflow_dispatch:
concurrency:
  group: map2-30-building-gap-system
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-30-building-gap-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply MAP2-30/31
        run: python tools/map2-30-building-gap-system.py
      - name: Apply MAP2-32/33
        run: python tools/map2-32-33-building-roles-playable-passages.py
      - name: Apply MAP2-34
        run: python tools/map2-34-controlled-chaos.py
      - name: Apply MAP2-35
        run: python tools/map2-35-decision-sightlines.py
      - name: Apply MAP2-36/37
        run: python tools/map2-36-37-ground-route-costs.py
      - name: Validate MAP2-30 markers
        run: |
          grep -q "map2BuildBuildingGapBlockSystem" index.html
          grep -q "BUILDING_COMPLEX_FIRST_GAPS_SECOND_ROUTE_THIRD" index.html
          grep -q "map2GapBlockId" index.html
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: MAP2-35 decision-sightline QA
        run: node tests/map2-35-decision-sightlines.cjs
      - name: MAP2-36/37 ground and route-cost QA
        run: node tests/map2-36-37-ground-route-costs.cjs
      - name: MAP2-34 controlled-chaos QA
        run: node tests/map2-34-controlled-chaos.cjs
      - name: MAP2-32/33 playable branch QA
        run: node tests/map2-32-33-building-roles-playable-passages.cjs
      - name: MAP2-30/31 building gap QA
        run: node tests/map2-30-building-gap-system.cjs
      - name: MAP2-29C ground audit regression
        run: node tests/map2-29c-independent-ground-audit.cjs
      - name: MAP2-28 chicane regression
        run: node tests/map2-28-architectural-chicane-chains.cjs
      - name: MAP2-27 road-cleanup regression
        if: ${{ !cancelled() }}
        run: node tests/map2-27-architectural-road-cleanup.cjs
      - name: MAP2-25 through-building regression
        if: ${{ !cancelled() }}
        run: node tests/map2-25-through-building-route-modules.cjs
      - name: MAP2-19 buildings-are-road regression
        if: ${{ !cancelled() }}
        run: node tests/map2-19-buildings-are-road.cjs
      - name: MAP2-11 KEEP IT LOW regression
        if: ${{ !cancelled() }}
        run: node tests/map2-11-keep-it-low-visual.cjs
      - name: Persist generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index already contains MAP2-37"
          else
            git commit -m "MAP2-37 persist tested ground and measured route choices"
            git push origin HEAD:codex/map2-30-building-gap-system
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-34-controlled-chaos-evidence
          path: tests/map2-34-evidence/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-35-decision-sightline-evidence
          path: tests/map2-35-evidence/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-36-37-ground-route-evidence
          path: tests/map2-36-37-evidence/
          if-no-files-found: warn
