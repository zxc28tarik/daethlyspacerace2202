name: MAP2-13 clone final Map4 stations
on:
  push:
    branches: [codex/map2-12-map4-building-reuse]
    paths:
      - tools/map2-13-clone-final-map4-stations.py
      - .github/workflows/map2-13-clone-final-map4-stations.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-12-map4-building-reuse
          fetch-depth: 0
      - name: Apply direct station clone patch
        run: python tools/map2-13-clone-final-map4-stations.py
      - name: Validate clone path
        run: |
          grep -q "source.clone(true)" index.html
          grep -q "MAP2_CLONED_W05_INDUSTRY_STATION" index.html
          grep -q "buildPlanetaryWorld();" index.html
      - name: Commit game patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-13 clone final Map4 W05 station groups into Map2"
          git push origin HEAD:codex/map2-12-map4-building-reuse
