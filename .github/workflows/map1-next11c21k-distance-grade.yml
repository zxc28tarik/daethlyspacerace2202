name: Map1 NEXT11C21K Cohesive Color and Distance Readability
on:
  push:
    branches: [codex/map1-distance-color-cohesion-21k]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map1-grade-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium, Three and offline build dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Real WebGL identical-camera atmosphere and mineral A-B
        run: |
          node --check tests/map1-next11c21k-distance-grade.cjs
          node tests/map1-next11c21k-distance-grade.cjs
      - name: Keep old contact effects, geometry, hazards and prizes
        run: |
          node tests/map1-next11c21j-contact-cues.cjs
          node tests/map1-next11c21i-barrier-wreck.cjs
          node tests/map1-next11c21h-meteors.cjs
          node tests/map1-next11c21g6-original-box.cjs
      - name: Guard existing SB-07 and corridor renderer
        run: |
          node tests/map1-next11c20-sb07-zenit.cjs
          node tests/map1-next11c20r-rail-seams.cjs
      - name: Build latest complete OFFLINE single-file HTML
        run: node tools/build-gfx01-bundle.cjs
      - name: Export actual WebGL before-after photos, playable and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-c21k-depth-color-playable-webgl
          path: |
            tests/next11c21k-evidence/
            dist/Uzay_Yarisi_Guncel_Oynanabilir.html
            dist/gfx01-build-manifest.json
          if-no-files-found: warn
