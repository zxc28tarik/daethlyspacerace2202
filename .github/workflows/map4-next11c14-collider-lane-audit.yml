name: Map 4 NEXT-11C14 Industrial Collision Route Audit
on:
  push:
    branches: [codex/map4-gfx11c14-collider-lane-survey]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next11c14-lane-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install real Chromium/Three WebGL QA
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Verify all 4 route profiles against original player impact algorithm
        run: node tests/map4-gfx11c14-collider-lane-survey.cjs
      - name: Preserve exact route obstacle provenance for user-approved physics decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map4-next11c14-industrial-collision-lanes
          path: tests/map4-next11c14-flight-lane-collision-map.json
          if-no-files-found: warn
