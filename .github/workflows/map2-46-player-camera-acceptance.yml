name: MAP2-46 player camera acceptance
on:
  push:
    branches: [codex/map2-41-world-ground-wide-city]
    paths:
      - index.html
      - tests/map2-46-player-camera-acceptance.cjs
      - .github/workflows/map2-46-player-camera-acceptance.yml
  pull_request:
    branches: [codex/map2-40-full-architecture-rhythm]
    paths:
      - index.html
      - tests/map2-46-player-camera-acceptance.cjs
      - .github/workflows/map2-46-player-camera-acceptance.yml
  workflow_dispatch:
concurrency:
  group: map2-46-player-camera-acceptance
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.56.1 three@0.128.0
      - run: npx playwright install --with-deps chromium
      - name: MAP2-46 actual player-camera sweep
        run: node tests/map2-46-player-camera-acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-46-player-camera-evidence
          path: tests/map2-46-evidence/
          if-no-files-found: warn
      - name: MAP2-45 rivals/performance regression
        if: ${{ success() }}
        run: node tests/map2-45-rivals-performance.cjs
      - name: MAP2-44 physical consistency regression
        if: ${{ success() }}
        run: node tests/map2-44-physical-consistency.cjs
      - name: MAP2-39 sector propagation regression
        if: ${{ success() }}
        run: node tests/map2-39-sector-propagation.cjs
