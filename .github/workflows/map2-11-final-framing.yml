name: MAP2-11 apply final patrol framing
on:
  push:
    branches: [codex/map2-11-keep-it-low-visual-language]
    paths:
      - tools/map2-11-final-framing.py
      - .github/workflows/map2-11-final-framing.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-11-keep-it-low-visual-language
          fetch-depth: 0
      - run: python tools/map2-11-final-framing.py
      - name: Validate final framing
        run: |
          grep -q "setScalar(2.8)" index.html
          grep -q "const altitude=300-v.approach\*20+strike\*55" index.html
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-11 finalize patrol framing"
          git push origin HEAD:codex/map2-11-keep-it-low-visual-language
