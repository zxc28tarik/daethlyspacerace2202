name: MAP2 — synchronize retired patrol in standalone playable HTML
on:
  push:
    branches:
      - feature/map2-remove-overhead-patrol-2026-11-27
  workflow_dispatch:
permissions:
  contents: write
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch downloadable playable HTML
        run: python3 tools/map2-remove-patrol-sync.py
      - name: Check patch and static gameplay assertions
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path("index.html"), Path("dist/Uzay_Yarisi_Guncel_Oynanabilir.html")]:
              text = path.read_text(encoding="utf-8")
              for banned in ("MAP2_OVERHEAD_PATROL", "map2PatrolTick", "map2PatrolWarning", "DEVRİYE ATEŞİ"):
                  assert banned not in text, (path, banned)
              assert "MAP2_TEST_SHIELD_MULTIPLIER" in text
          PY
      - name: Commit synchronized standalone HTML
        run: |
          git add dist/Uzay_Yarisi_Guncel_Oynanabilir.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "MAP2: synchronize standalone HTML after removing overhead patrol"
            git push
          fi
