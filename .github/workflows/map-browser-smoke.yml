name: Map 1 / Map 4 Browser Smoke
on:
  push:
    branches: [feature/map4-hunter-race, feature/map4-planetary-crossing, feature/map4-four-phase-ascent, feature/map4-world-content-wave1, feature/map4-world-w02-expanse, feature/map4-w03-canyon-routes, feature/map4-w04-arena-warfront, feature/map4-w05-industrial-gauntlet, feature/map4-visual-quality-pass1, feature/map4-visual-quality-pass2, feature/map4-vq03-materials-vfx, codex/map4-vq04-atmospheric-depth, codex/map4-gfx00-baseline-gfx02-canyon, codex/map4-gfx03-canyon-hero-models, codex/map4-gfx01-asset-pipeline, codex/map4-gfx01b-sculpted-glb-lods, codex/map4-gfx03b-hero-cleanup-hud, codex/map4-gfx04-arena-hero-art, codex/map4-gfx04b-carrier-glb-damage, codex/map4-gfx04c-elite-battery-glb, codex/map4-gfx04d-smoke-impact-vfx, codex/map4-gfx04e-cinematic-warfront-lighting, codex/map4-gfx05-craft-silhouettes, codex/map4-gfx05b-surface-quality, codex/map4-gfx05c-instanced-exhaust, codex/map4-gfx06a-refinery-transfer-art, codex/map4-gfx06b-press-cooling-art, codex/map4-vis02-industrial-facades, codex/map4-gfx06c-logistics-power, codex/map4-gfx06d-industrial-material-lod, codex/map4-gfx06d-c-service-decals, codex/map4-next06-final-sector-hero-art, codex/map4-gfx07-final-sector-atmosphere, codex/map4-gfx08-combat-impact-vfx, codex/map4-gfx09-camera-hud-post, codex/map4-gfx10-quality-profiles, codex/map4-gfx10b-endurance-churn, codex/map4-gfx11-visual-acceptance-gallery, codex/map4-gfx11b-arena-industrial-visibility, codex/map4-gfx11c-industrial-identity-art, codex/map4-gfx11c2-industrial-contrast-composition, codex/map4-gfx11c3-industrial-scene-composition, codex/map4-gfx11c4-authored-hero-architecture, codex/map4-gfx11c5-weathered-pbr-lighting, codex/map4-gfx11c6-silhouette-depth, codex/map4-gfx11c7-industrial-curation, codex/map4-gfx11c8-authored-facades-ground, codex/map4-gfx11c9-functional-factories, codex/map4-gfx11c10-original-districts, codex/map4-gfx11c11-nearfield-facade-relief, codex/map4-gfx11c12-architectural-depth, codex/map4-gfx11c13-motion-ring-provenance, codex/map4-gfx11c14-collider-lane-survey, codex/map4-gfx11c15-transition-clearance-audit, codex/map4-gfx11c16-scripted-pilot-feasibility, codex/map4-gfx11c17-dense-industrial-machinery, codex/map4-next11c18-power-flight-controls, codex/two-map-player-ships-cinematic-chase, codex/map1-sb07-zenit-reference-implementation, codex/map1-sb07-zenit-visual-polish, codex/map1-sb07-zenit-visual-glow-pass, codex/map1-sb07-zenit-detail-wave2, codex/map1-sb07-zenit-surface-art-e, codex/map1-sb07-zenit-lighting-f, codex/map1-sb07-zenit-edge-quality-g, codex/map1-sb07-zenit-review-h, codex/map1-sb07-zenit-unified-surfaces-i, codex/map1-sb07-zenit-surface-fit-j, codex/map1-sb07-zenit-overlap-fix-k, codex/map1-sb07-zenit-webgl-qa-fix-l, codex/map1-sb07-zenit-boost-qa-determinism-m, codex/map1-sb07-zenit-native-budget-evidence-n, codex/map1-sb07-zenit-corridor-clarity-o, codex/map1-sb07-zenit-distance-clarity-p, codex/map1-sb07-zenit-guide-contrast-q, codex/map1-sb07-zenit-rail-seams-r, codex/map1-sb07-zenit-aa-budget-s, codex/map1-sb07-zenit-supersampling-budget-t, codex/map1-sb07-zenit-fairing-contour-u, codex/map1-sb07-zenit-wing-root-v, codex/map1-sb07-zenit-conformal-paint-w, codex/map1-sb07-zenit-shoulder-skin-x, codex/map1-sb07-zenit-loft-normals-y, codex/map1-sb07-zenit-nose-engine-normals-z, codex/map1-sb07-zenit-pbr-materials-21a, codex/map1-sb07-zenit-balanced-colors-21b, codex/map1-sb07-zenit-red-flow-21c, codex/map1-sb07-zenit-engine-tone-21d, codex/map1-sb07-zenit-final-color-review-21e, codex/map1-sb07-zenit-race-camera-exposure-21f, codex/map1-reward-hyper-pickup-art-21g, main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          # Ubuntu hosted runner already provides Chrome shared libraries.
          # Avoid flaky 503 Ubuntu apt repos used by --with-deps.
          npx playwright install chromium
      - name: Build offline GLB game bundle
        run: node tools/build-gfx01-bundle.cjs
      - name: Verify offline game and cached GLBs in Chromium
        run: node tests/map4-gfx01-offline.cjs
      # Run the newest art QA early so regressions fail fast, then run the
      # unchanged complete Map1/Map4/GFX09–GFX11 historical suite.
      - name: NEXT11C20O — Map1 192-to-10 merged corridor rings and unchanged Map4
        run: node tests/map1-next11c20o-corridor-clarity.cjs
      - name: NEXT11C20P — long rail groups, per-pixel distance attenuation and original Map4
        run: node tests/map1-next11c20p-distance-clarity.cjs
      - name: NEXT11C20Q — same-camera WebGL A-B and near-safe warning fade
        run: node tests/map1-next11c20q-guide-contrast.cjs
      - name: NEXT11C20R — no missing rail seam at any of 19 x 16 joins
        run: node tests/map1-next11c20r-rail-seams.cjs
      - name: NEXT11C20S — 720p/1080p native MSAA vs 2x high-quality reference and motion delta
        run: node tests/map1-next11c20s-msaa-shimmer-budget.cjs
      - name: NEXT11C20T — 1x/1.25x/1.5x/2x controlled QA and native GPU cost gate
        run: node tests/map1-next11c20t-four-quality-levels.cjs
      - name: NEXT11C20U — actual SB-07 surface continuity and four viewpoints
        run: node tests/map1-next11c20u-contoured-spines.cjs
      - name: NEXT11C20V — original MSAA wing-root loft, 60 vertex geometry and four WebGL views
        run: node tests/map1-next11c20v-wing-root-fillet.cjs
      - name: NEXT11C20W — original-MSAA 102 wing paint and 52 flush flap seam vertex checks
        run: node tests/map1-next11c20w-paint-and-inlays.cjs
      - name: NEXT11C20X — 174 real shoulder/paint and engine-wing vertices, 6 true surface raycasts
        run: node tests/map1-next11c20x-shoulder-aft-skins.cjs
      - name: NEXT11C20Y — top surface normals of 180 true loft vertices, real face orientation
        run: node tests/map1-next11c20y-smooth-loft-normals.cjs
      - name: NEXT11C20Z — 138 nose/engine roof normals and 4 genuine outward triangles
        run: node tests/map1-next11c20z-nose-engine-roof-normals.cjs
      - name: NEXT11C21A — genuine PBR ceramic versus brushed metal texture buffers
        run: node tests/map1-next11c21a-native-pbr-finishes.cjs
      - name: NEXT11C21B — balanced RGB pigment hierarchy on four native WebGL ship batches
        run: node tests/map1-next11c21b-balanced-colors.cjs
      - name: NEXT11C21C — real WebGL red race-flow before-and-after on unchanged ship geometry
        run: node tests/map1-next11c21c-red-flow.cjs
      - name: NEXT11C21D — unchanged real engine plasma and amber vs renewed steel material
        run: node tests/map1-next11c21d-engine-tone.cjs
      - name: NEXT11C21E — final native WebGL color balance four-angle contact sheet
        run: node tests/map1-next11c21e-final-color-review.cjs
      - name: NEXT11C21F — actual Map1 chase camera normal and boost color exposure
        run: node tests/map1-next11c21f-game-camera.cjs
      - name: NEXT11C21G — collectible reward HYPER VFX isolated from manual boost
        run: node tests/map1-next11c21g-reward-hyper.cjs
      - name: NEXT11C20 — user-approved SB-07 Zenit race model, 3D silhouette and unchanged Map4
        run: node tests/map1-next11c20-sb07-zenit.cjs
      - name: NEXT11C19 — two original ships and cinematic chase normal/boost validation
        run: node tests/map4-next11c19-two-player-ships.cjs
      - name: NEXT11C18 — three-system power distribution and boost-drift / Map1 isolation
        run: node tests/map4-next11c18-power-flight.cjs
      - name: NEXT11C17 — 96 authored industrial units, real WebGL A/B and physics integrity
        run: node tests/map4-gfx11c17-industrial-density.cjs
      - name: NEXT11C16 — original updateGame scripted player controls, read-only
        run: node tests/map4-gfx11c16-scripted-pilot-controls.cjs
      - name: NEXT11C15 — read-only swept lane transitions and fixed C14 cross-check
        run: node tests/map4-gfx11c15-transition-clearance.cjs
      - name: NEXT11C14 — actual swept collider route clearance and 08 factory blockage
        run: node tests/map4-gfx11c14-collider-lane-survey.cjs
      - name: NEXT11C13 — 18 motion viewpoints, protected nav ring provenance
        run: node tests/map4-gfx11c13-motion-ring-provenance.cjs
        env:
          C13_SKIP_SCREENSHOTS: '1'
      - name: NEXT11C13 — inspect 08 fast-low visual-only camera occlusion
        run: node tests/map4-gfx11c13-fast-low-occlusion.cjs
      - name: NEXT11C12 — original near-mid industrial depth and non-nav decor A/B
        run: node tests/map4-gfx11c12-architectural-depth.cjs
      - name: NEXT11C11 — protected physical W02 building macro facade A/B
        run: node tests/map4-gfx11c11-nearfield-facade-relief.cjs
      - name: NEXT11C10 — original three-district factory art 07-09 real WebGL A/B
        run: node tests/map4-gfx11c10-original-districts.cjs
      - name: NEXT11C9 — functional machinery, protected roofs and ring-free exit WebGL A/B
        run: node tests/map4-gfx11c9-functional-factories.cjs
      - name: NEXT11C8 — authored factory facades and industrial terrain WebGL A/B
        run: node tests/map4-gfx11c8-authored-facades-ground.cjs
      - name: NEXT11C7 — visual-only industrial cleanup, 07-09 WebGL A/B
        run: node tests/map4-gfx11c7-industrial-curation.cjs
      - name: NEXT11C6 — authored industrial skyline depth and 07-09 WebGL A/B
        run: node tests/map4-gfx11c6-silhouette-depth.cjs
      - name: NEXT11C5 — weathered PBR, soft shadows and industrial light A/B
        run: node tests/map4-gfx11c5-weathered-pbr-lighting.cjs
      - name: Test both maps with Chromium
        run: node tests/map4-browser-smoke.cjs
      - name: Verify GFX09 720p and 1080p camera and HUD
        run: node tests/map4-gfx09-camera-hud.cjs
      - name: Verify GFX10 quality profiles and renderer budgets
        run: node tests/map4-gfx10-profiles.cjs
      - name: Verify GFX10B simulated 300s VFX endurance and bounded resources
        run: node tests/map4-gfx10b-endurance.cjs
      - name: Diagnose GFX11B arena/industrial exit visibility
        run: node tests/map4-gfx11b-visibility-diagnostic.cjs
      - name: Verify GFX11B arena and industry camera visual regression
        run: node tests/map4-gfx11b-visual-acceptance.cjs
      - name: Verify GFX11C factory silhouettes and arena visual identities
        run: node tests/map4-gfx11c-industrial-identity.cjs
      - name: GFX11C2 — verify industrial contrast A/B, renderer and physics stability
        run: node tests/map4-gfx11c2-industrial-composition.cjs
      - name: NEXT11C3 — industrial scene depth, old-new A/B and protected colliders
        run: node tests/map4-gfx11c3-industrial-scene.cjs
      - name: NEXT11C4 — validate authored 3D hero architecture, A/B and native budgets
        run: node tests/map4-gfx11c4-authored-hero-art.cjs
      - name: Capture fixed art baselines and renderer stats
        env:
          GFX01_HTML_PATH: dist/Uzay_Yarisi_Guncel_Oynanabilir.html
        run: node tests/map4-art-baseline.cjs
      - name: Fetch true GFX00 October 2026 historical 12-stage evidence
        uses: actions/download-artifact@v4
        with:
          repository: zxc28tarik/daethlyspacerace2202
          run-id: 39392177682
          name: map4-fixed-art-baselines
          github-token: ${{ github.token }}
          path: tests/gfx11-historical
      - name: GFX11 — validate 15 before/after pairs, 12 stage frames and create offline gallery
        run: node scripts/map4-gfx11-audit.cjs
      - name: Keep NEXT11 offline visual acceptance gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map4-gfx11-visual-review-gallery
          path: dist/gfx11-visual-review/
          if-no-files-found: error
      # Independent playable preview for review before merging into main.
      # The source HTML still loads CDNs; this built artifact is truly offline.
      - name: Keep branch-specific playable offline HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map4-current-branch-playable-html
          path: dist/Uzay_Yarisi_Guncel_Oynanabilir.html
          if-no-files-found: error
      - name: Keep GFX01 offline build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map4-gfx01-bundle-proof
          path: |
            dist/gfx01-build-manifest.json
            tests/gfx01-offline-map4.png
          if-no-files-found: ignore
      - name: Keep fixed art baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map4-fixed-art-baselines
          path: tests/art-baseline/
          if-no-files-found: ignore
      - name: Keep gameplay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map4-browser-smoke-images
          path: tests/map4-*.png
          if-no-files-found: ignore
