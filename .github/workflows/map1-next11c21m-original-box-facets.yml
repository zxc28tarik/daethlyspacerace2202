name: Map1 NEXT11C21M Original Purple Box Face Depth
on:
  push:
    branches: [codex/map1-original-box-facet-depth-21m]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map1-original-box-facets:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install native Chromium WebGL and offline build prerequisites
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: C21M real WebGL old/new with identical camera, untouched geometry, Map4 isolation
        run: |
          node --check tests/map1-next11c21m-box-facets.cjs
          node tests/map1-next11c21m-box-facets.cjs
      - name: C21L original light balance and historical C21K/J/I/H/G6 art regressions
        run: |
          node tests/map1-next11c21l-light-balance.cjs
          node tests/map1-next11c21k-distance-grade.cjs
          node tests/map1-next11c21j-contact-cues.cjs
          node tests/map1-next11c21i-barrier-wreck.cjs
          node tests/map1-next11c21h-meteors.cjs
          node tests/map1-next11c21g6-original-box.cjs
      - name: Existing SB07 ship and corridor render invariants
        run: |
          node tests/map1-next11c20-sb07-zenit.cjs
          node tests/map1-next11c20r-rail-seams.cjs
      - name: Build full current OFFLINE playable HTML
        run: node tools/build-gfx01-bundle.cjs
      - name: Save visual comparison, complete HTML and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-c21m-original-box-facets-playable
          path: |
            tests/next11c21m-evidence/
            dist/Uzay_Yarisi_Guncel_Oynanabilir.html
            dist/gfx01-build-manifest.json
          if-no-files-found: warn
