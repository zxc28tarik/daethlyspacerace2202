name: MAP2-48 detached Map2 build and QA
on:
  push:
    branches: [feature/map2-48-independent-buildings]
    paths:
      - tests/map2-48-export-source-library.cjs
      - tests/map2-48-visual-fingerprint.js
      - tools/map2-48-embed-library.py
      - tests/map2-48-detached-runtime.cjs
      - .github/workflows/map2-48-detached-build.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: map2-48-detached-build
  cancel-in-progress: true
jobs:
  detached-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Browser libraries
        run: npm install --no-save playwright@1.56.1 three@0.128.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Snapshot the current finished visual sources
        run: node tests/map2-48-export-source-library.cjs
      - name: Retain untouched game HTML as structural baseline
        run: cp index.html tests/map2-48-evidence/baseline.html
      - name: Install self-contained Map2 asset snapshot in both game HTMLs
        run: python3 tools/map2-48-embed-library.py
      - name: Verify Map2 independent loader with Map4 never constructed
        run: node tests/map2-48-detached-runtime.cjs
      - name: Physical building, collision and alternative-route regression
        run: node tests/map2-44-physical-consistency.cjs
      - name: Full 175 km pilot and bot flight regression
        run: node tests/map2-04-low-flight-patrol.cjs
      - name: Map2 alternative-route labels
        run: node tests/map2-46-route-hud-clarity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-48-detached-visual-and-physical-evidence
          path: tests/map2-48-evidence/
          if-no-files-found: warn
      - name: Commit verified detached game files to feature branch only
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/Uzay_Yarisi_Guncel_Oynanabilir.html
          git diff --cached --quiet || git commit -m "MAP2-48: load exact archived buildings without creating Map4 world"
          git push origin HEAD:feature/map2-48-independent-buildings
