name: Map 4 NEXT-11C11 Visual Preview
on:
  push:
    branches: [codex/map4-gfx11c11-nearfield-facade-relief]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next11c11-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium WebGL QA
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Verify protected C11 W02 near-field relief and capture 07-08-09
        run: node tests/map4-gfx11c11-nearfield-facade-relief.cjs
      - name: Keep NEXT-11C11 original near-field A/B screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map4-next11c11-07-08-09-review
          path: tests/map4-gfx11c11-*.png
          if-no-files-found: warn
