name: MAP2-14 dense Map4 road buildings
on:
  push:
    branches: [codex/map2-14-dense-map4-road-buildings]
    paths:
      - tools/map2-14-dense-map4-buildings.py
      - tests/map2-14-dense-map4-road-buildings.cjs
      - .github/workflows/map2-14-dense-map4-road-buildings.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-14-dense-map4-road-buildings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply dense exact-Map4 placement patch
        run: python tools/map2-14-dense-map4-buildings.py
      - name: Validate placement markers
        run: |
          grep -q "d+=3600" index.html
          grep -q "map2TargetDistance=d" index.html
          grep -q "flankSide" index.html
          grep -q "source.clone(true)" index.html
          ! grep -q "MAP2_VISUAL_FACTORY_" index.html
      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: MAP2-14 dense road-building QA
        run: node tests/map2-14-dense-map4-road-buildings.cjs
      - name: MAP2-13 exact clone regression
        run: node tests/map2-13-exact-map4-clones.cjs
      - name: MAP2-11 visual regression
        run: node tests/map2-11-keep-it-low-visual.cjs
      - name: Commit game placement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-14 densify exact Map4 buildings across Map2 road"
          git push origin HEAD:codex/map2-14-dense-map4-road-buildings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-14-dense-map4-road-evidence
          path: tests/map2-14-evidence/
          if-no-files-found: warn
