name: MAP2-09 bootstrap industrial detail pass
on:
  push:
    branches: [codex/map2-09-industrial-detail-pass]
    paths:
      - tools/map2-09-patch.py
      - .github/workflows/map2-09-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-09-industrial-detail-pass
          fetch-depth: 0
      - name: Apply MAP2-09 detail patch
        run: python tools/map2-09-patch.py
      - name: Validate detail markers
        run: |
          grep -q "MAP2_PIPE_" index.html
          grep -q "MAP2_TANK_" index.html
          grep -q "MAP2_CATWALK_" index.html
          grep -q "MAP2_HANGAR_RIB_" index.html
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-09 add industrial facility detail language"
          git push origin HEAD:codex/map2-09-industrial-detail-pass
