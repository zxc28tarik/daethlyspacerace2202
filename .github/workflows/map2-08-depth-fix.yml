name: MAP2-08 apply visual tunnel correction
on:
  push:
    branches: [codex/map2-08-visual-stage-rebuild]
    paths:
      - tools/map2-08-depth-fix.py
      - .github/workflows/map2-08-depth-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-08-visual-stage-rebuild
          fetch-depth: 0
      - name: Separate physical and visual passage depth
        run: python tools/map2-08-depth-fix.py
      - name: Validate correction
        run: |
          grep -q "const depth=\[210,180,255,310\]" index.html
          grep -q "visualTunnelDepth=\[680,540,760,620\]" index.html
      - name: Commit corrected game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-08 keep safe collision depth with long visual factory shells"
          git push origin HEAD:codex/map2-08-visual-stage-rebuild
