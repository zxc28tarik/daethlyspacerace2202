name: MAP2-11 normalize active patrol sweep
on:
  push:
    branches: [codex/map2-11-keep-it-low-visual-language]
    paths:
      - tools/map2-11-active-sweep-fix.py
      - .github/workflows/map2-11-active-sweep-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-11-keep-it-low-visual-language
          fetch-depth: 0
      - run: python tools/map2-11-active-sweep-fix.py
      - name: Validate patrol framing
        run: |
          grep -q "setScalar(3.0)" index.html
          grep -q "const ahead=105-v.approach\*28+strike\*50" index.html
          grep -q "active?28:82" index.html
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-11 normalize active patrol screen sweep"
          git push origin HEAD:codex/map2-11-keep-it-low-visual-language
