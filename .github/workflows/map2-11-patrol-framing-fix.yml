name: MAP2-11 apply patrol framing correction
on:
  push:
    branches: [codex/map2-11-keep-it-low-visual-language]
    paths:
      - tools/map2-11-patrol-framing-fix.py
      - .github/workflows/map2-11-patrol-framing-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-11-keep-it-low-visual-language
          fetch-depth: 0
      - run: python tools/map2-11-patrol-framing-fix.py
      - name: Validate framing
        run: |
          grep -q "setScalar(4.1)" index.html
          grep -q "depthTest:false" index.html
          grep -q "const ahead=285-v.approach\*120+strike\*80" index.html
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-11 keep patrol warning visible in frame"
          git push origin HEAD:codex/map2-11-keep-it-low-visual-language
