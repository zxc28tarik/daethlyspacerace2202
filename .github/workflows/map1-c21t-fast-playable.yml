name: Map1 NEXT11C21T Fast Playable HTML
on:
  push:
    branches: [codex/map1-sb07-red-coat-surface-cleanup-21t]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-offline-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install offline game bundle dependencies
        run: npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
      - name: Build complete single-file offline playable game
        run: node tools/build-gfx01-bundle.cjs
      - name: Publish full updated C21T game
        uses: actions/upload-artifact@v4
        with:
          name: map1-c21t-fast-playable-html
          path: |
            dist/Uzay_Yarisi_Guncel_Oynanabilir.html
            dist/gfx01-build-manifest.json
          if-no-files-found: error
