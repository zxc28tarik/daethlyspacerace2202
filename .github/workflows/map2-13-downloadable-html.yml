name: MAP2-13 exact clone downloadable HTML
on:
  push:
    branches: [codex/map2-13-exact-map4-station-clones]
    paths:
      - .github/workflows/map2-13-downloadable-html.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-13-exact-map4-station-clones
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install offline dependencies
        run: npm install --no-save three@0.128.0 tailwindcss@3.4.17
      - name: Build exact-clone one-file HTML
        run: |
          node tools/build-gfx01-bundle.cjs
          test -s dist/Uzay_Yarisi_Guncel_Oynanabilir.html
          cp dist/Uzay_Yarisi_Guncel_Oynanabilir.html DEATHLY_SPACE_RACE_MAP2_13_EXACT_MAP4_CLONES.html
          sha256sum DEATHLY_SPACE_RACE_MAP2_13_EXACT_MAP4_CLONES.html
      - uses: actions/upload-artifact@v4
        with:
          name: deathly-space-race-map2-13-exact-map4-clones
          path: DEATHLY_SPACE_RACE_MAP2_13_EXACT_MAP4_CLONES.html
          if-no-files-found: error
