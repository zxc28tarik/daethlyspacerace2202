name: MAP2-25 AI route source scan
on:
  push:
    branches: [codex/map2-25-through-building-route-modules]
    paths:
      - tools/map2-25-ai-route-source-scan.py
      - .github/workflows/map2-25-ai-route-source-scan.yml
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-25-through-building-route-modules
      - run: python tools/map2-25-ai-route-source-scan.py
