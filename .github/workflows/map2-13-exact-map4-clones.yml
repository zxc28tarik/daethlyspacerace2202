name: MAP2-13 exact Map4 station clone browser QA
on:
  push:
    branches: [codex/map2-13-exact-map4-station-clones]
    paths:
      - index.html
      - tests/map2-13-exact-map4-clones.cjs
      - .github/workflows/map2-13-exact-map4-clones.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - name: MAP2-13 exact Map4 clone QA
        run: node tests/map2-13-exact-map4-clones.cjs
      - name: MAP2-11 regression
        run: node tests/map2-11-keep-it-low-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-13-exact-clone-evidence
          path: tests/map2-13-evidence/
          if-no-files-found: warn
