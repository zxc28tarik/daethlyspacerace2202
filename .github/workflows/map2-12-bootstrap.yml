name: MAP2-12 apply Map4 building reuse
on:
  push:
    branches: [codex/map2-12-map4-building-reuse]
    paths:
      - tools/map2-12-map4-building-patch.py
      - .github/workflows/map2-12-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-12-map4-building-reuse
          fetch-depth: 0
      - name: Apply Map4 building reuse
        run: python tools/map2-12-map4-building-patch.py
      - name: Validate source markers
        run: |
          grep -q "MAP2_MAP4_REFINERY" index.html
          grep -q "MAP2_MAP4_FACTORY" index.html
          grep -q "MAP2_MAP4_POWER" index.html
          grep -q "MAP2_MAP4_OUTPOST" index.html
          ! grep -q "MAP2_VISUAL_FACTORY_" index.html
      - name: Commit game patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "MAP2-12 replace placeholders with Map4 buildings"
          git push origin HEAD:codex/map2-12-map4-building-reuse
