name: MAP2-44 physical consistency
on:
  push:
    branches: [codex/map2-41-world-ground-wide-city]
    paths:
      - index.html
      - tests/map2-44-physical-consistency.cjs
      - .github/workflows/map2-44-physical-consistency.yml
  pull_request:
    branches: [codex/map2-40-full-architecture-rhythm]
    paths:
      - index.html
      - tests/map2-44-physical-consistency.cjs
      - .github/workflows/map2-44-physical-consistency.yml
  workflow_dispatch:
concurrency:
  group: map2-44-physical-consistency
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.56.1 three@0.128.0
      - run: npx playwright install --with-deps chromium
      - name: MAP2-44 physical shell and route consistency
        run: node tests/map2-44-physical-consistency.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map2-44-physical-consistency-evidence
          path: tests/map2-44-evidence/
          if-no-files-found: warn
      - name: MAP2-43 natural route readability regression
        if: ${{ success() }}
        run: node tests/map2-43-natural-route-readability.cjs
      - name: MAP2-42 widened urban course regression
        if: ${{ success() }}
        run: node tests/map2-42-wide-urban-course.cjs
      - name: MAP2-41 world terrain / width regression
        if: ${{ success() }}
        run: node tests/map2-41-world-ground-wide-city.cjs
