name: MAP2-24 canyon baseline
on:
  push:
    branches: [codex/map2-24-connected-architectural-canyons]
    paths:
      - tests/map2-24-canyon-baseline.cjs
      - .github/workflows/map2-24-canyon-baseline.yml
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-24-connected-architectural-canyons
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - run: node tests/map2-24-canyon-baseline.cjs
