name: Map1 NEXT11C21H Original Meteor Surface Art
on:
  push:
    branches: [codex/map1-meteor-surface-color-21h]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meteor-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and offline HTML build dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Native meteor geometry, visual, physics and Map4 WebGL QA
        run: |
          node --check tests/map1-next11c21h-meteors.cjs
          node tests/map1-next11c21h-meteors.cjs
      - name: Guard original purple pickup boxes and prize logic
        run: node tests/map1-next11c21g6-original-box.cjs
      - name: Guard SB-07 ship and corridor
        run: |
          node tests/map1-next11c20-sb07-zenit.cjs
          node tests/map1-next11c20r-rail-seams.cjs
      - name: Build current offline playable entire game
        run: node tools/build-gfx01-bundle.cjs
      - name: Upload actual screenshots, acceptance report and playable HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-c21h-original-meteor-surface-playable
          path: |
            tests/next11c21h-evidence/
            dist/Uzay_Yarisi_Guncel_Oynanabilir.html
            dist/gfx01-build-manifest.json
          if-no-files-found: warn
