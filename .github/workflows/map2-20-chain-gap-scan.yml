name: MAP2-20 building chain gap scan
on:
  push:
    branches: [codex/map2-20-continuous-building-chains]
    paths:
      - tests/map2-20-chain-gap-scan.cjs
      - .github/workflows/map2-20-chain-gap-scan.yml
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map2-20-continuous-building-chains
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - run: node tests/map2-20-chain-gap-scan.cjs
