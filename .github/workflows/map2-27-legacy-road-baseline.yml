name: MAP2-27 legacy road baseline
on:
  push:
    branches: [codex/map2-27-retire-legacy-central-road]
    paths:
      - tests/map2-27-legacy-road-baseline.cjs
      - .github/workflows/map2-27-legacy-road-baseline.yml
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/map2-27-retire-legacy-central-road}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm install --no-save playwright@1.56.1 three@0.128.0
          npx playwright install chromium
      - run: node tests/map2-27-legacy-road-baseline.cjs
