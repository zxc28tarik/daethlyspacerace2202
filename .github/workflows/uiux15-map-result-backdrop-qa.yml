name: UIUX15 Map-Aware Results Background QA
on:
  push:
    branches: [codex/uiux15-map-specific-results-backdrops]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium / WebGL smoke dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Parse HTML inline scripts and game logic
        run: |
          node --check tests/uiux14-podium-standings.cjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
            if(m[1].trim())new vm.Script(m[1]);
          }
          console.log('PASS all embedded scripts');
          NODE
      - name: Real Chromium two-map backdrop and podium regression
        run: node tests/uiux14-podium-standings.cjs
      - name: UIUX12 map-selection navigation and graphics regression
        run: node tests/uiux12-approved-map1-race-card.cjs
      - name: Upload result screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UIUX15-map-results-screenshots
          path: tests/uiux14-evidence/*.png
          if-no-files-found: warn
