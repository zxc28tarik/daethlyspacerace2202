name: MAP4 CITY02 Final Free-Flight City Preview
on:
  push:
    branches: [codex/map4-city02-real-urban-entry-flight]
    paths:
      - .github/workflows/map4-city02-quick-visual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot-before-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Capture actual Map4 city entrance and moving-camera frames
        run: node tests/map4-city02-real-entry-scene.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MAP4-CITY02-Quick-Camera-Frames
          path: tests/map4-city02-evidence/*
          if-no-files-found: warn
