name: Map1 NEXT11C21T Quick Real Camera Visual Proof
on:
  push:
    branches: [codex/map1-sb07-red-coat-surface-cleanup-21t]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c21t-real-game-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install native Chromium and WebGL dependencies
        run: |
          npm install --no-save playwright@1.56.1 three@0.128.0 tailwindcss@3.4.17
          npx playwright install chromium
      - name: Native 1600x900 original SB07 red-coat before/after
        run: node tests/map1-next11c21t-red-coat.cjs
      - name: Publish native screenshots and exact shader comparison metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map1-c21t-red-satin-game-camera-images
          path: tests/next11c21t-evidence/
          if-no-files-found: warn
